# Builds the API image for arm64 and amd64, pushes it to GitHub Container Registry and deploys it to the Oracle machine
# over SSH (docs/DEPLOY_ORACLE.md). It runs on a version tag (v*) or by hand; the deploy job waits for the `production`
# environment, where you can require a reviewer.
#
# Secrets to create in the repository (Settings > Secrets and variables > Actions) or, better, in the `production`
# environment: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key of a user that can run docker), DEPLOY_KNOWN_HOSTS
# (output of `ssh-keyscan -t ed25519 HOST`). Nothing here prints them.

name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the server after pushing the image"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    name: API image to ghcr.io
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name in lower case
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fuelrivals-api" >>"$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    needs: image
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" >~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" >$HOME/.ssh/known_hosts
      - name: Copy compose and Caddy files
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i "$HOME/.ssh/id_deploy" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            deploy/docker-compose.yml deploy/Caddyfile "$USER_NAME@$HOST:/opt/fuelrivals/"
      - name: Pull and restart the API
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          # The API tag is written to .env so the next `docker compose up` on the machine uses the same one.
          ssh -i "$HOME/.ssh/id_deploy" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts "$USER_NAME@$HOST" bash -s -- "$TAG" <<'REMOTE'
          set -euo pipefail
          cd /opt/fuelrivals
          tag="$1"
          if grep -q '^API_TAG=' .env; then sed -i "s|^API_TAG=.*|API_TAG=${tag}|" .env; else echo "API_TAG=${tag}" >> .env; fi
          docker compose pull api caddy
          docker compose up -d --no-deps api
          # Reload Caddy in place (open WebSockets stay for stream_close_delay).
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile || docker compose up -d caddy
          docker compose ps
          for i in $(seq 1 20); do
            if docker compose exec -T api /api healthcheck; then echo "api healthy"; exit 0; fi
            sleep 3
          done
          echo "api did not become healthy" >&2
          docker compose logs --tail=50 api >&2
          exit 1
          REMOTE
      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
