<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Fuel Rivals icon: a red car on a three-lane road, passing a yellow rival, with a fuel drop. Own work. -->
  <rect width="32" height="32" fill="#42ad37"/>
  <rect x="4" width="24" height="32" fill="#383838"/>
  <rect x="4" width="1" height="32" fill="#f0eeec"/>
  <rect x="27" width="1" height="32" fill="#f0eeec"/>
  <g fill="#a69f96">
    <rect x="12" y="1" width="1" height="4"/><rect x="12" y="9" width="1" height="4"/>
    <rect x="12" y="17" width="1" height="4"/><rect x="12" y="25" width="1" height="4"/>
    <rect x="19" y="1" width="1" height="4"/><rect x="19" y="9" width="1" height="4"/>
    <rect x="19" y="17" width="1" height="4"/><rect x="19" y="25" width="1" height="4"/>
  </g>
  <!-- rival car, yellow, ahead in the left lane -->
  <rect x="6" y="3" width="5" height="8" fill="#f4d03f"/>
  <rect x="7" y="4" width="3" height="2" fill="#32384a"/>
  <rect x="11" y="4" width="1" height="8" fill="#141414"/>
  <!-- player car, red, in the centre lane -->
  <rect x="13" y="14" width="6" height="11" fill="#e74c3c"/>
  <rect x="14" y="15" width="4" height="3" fill="#32384a"/>
  <rect x="14" y="22" width="4" height="2" fill="#b33a2e"/>
  <rect x="19" y="15" width="1" height="11" fill="#141414"/>
  <rect x="13" y="25" width="7" height="1" fill="#141414"/>
  <!-- fuel drop in the right lane -->
  <rect x="23" y="5" width="1" height="1" fill="#f4d03f"/>
  <rect x="22" y="6" width="3" height="2" fill="#f4d03f"/>
  <rect x="21" y="8" width="5" height="3" fill="#f4d03f"/>
  <rect x="22" y="11" width="3" height="1" fill="#f4d03f"/>
  <rect x="22" y="8" width="1" height="2" fill="#f0eeec"/>
</svg>
